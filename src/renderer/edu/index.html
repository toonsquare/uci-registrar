<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UCI 교육</title>
  <!--
    처음 사용자 교육 (대화형). 프로그램 안에서 iframe 으로 열린다.
    원본: UCI_교육프로그램_미연시 — 내용은 프로그램에 맞게 손봤다. (점수 없음, 5장은 실제 화면 연습)
    인물 그림은 edu.js 의 CHAR_IMAGES 에 경로를 적으면 코드 그림 대신 쓰인다.
  -->
  <link rel="stylesheet" href="edu.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="chap" id="chap">UCI 첫 발급 대작전</div>
    <button class="tb close" id="btnClose">닫기</button>
    <button class="tb" id="btnLog">기록</button>
    <button class="tb" id="btnReset">처음부터</button>
  </div>
  <div class="stage" id="stage">
    <div class="bg bg-office" id="bg"></div>
    <div class="char hide" id="char"></div>
    <div id="layer"></div>
    <div class="log" id="log"></div>
  </div>
</div>

<script src="edu.js"></script>
</body>
</html>
